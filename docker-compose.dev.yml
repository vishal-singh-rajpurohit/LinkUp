services:
  mongodb:
    image: mongo:latest
    container_name: linkup-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - linkup-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: linkup-backend
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    depends_on:
      - mongodb
    networks:
      - linkup-network

  frontend:
    build:
      context: ./app_pro
      dockerfile: Dockerfile.dev
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:5173}
        VITE_API: ${VITE_API:-http://localhost:5173/api/v1}
        VITE_API_: ${VITE_API_:-http://localhost:5173}
        VITE_API_EMOJI_API_KEY: ${VITE_API_EMOJI_API_KEY:-t9898u8omq3c23slaepfgdhwf6kjm63o7324pfvyxhgukn3b}
        VITE_API_CHAT_SECRET_KEY: ${VITE_API_CHAT_SECRET_KEY:-2f3c4a1e8d7b9c0a6f5d4e3b2a1908ff0a1b2c3d4e5f67890123456789abcdef}
    container_name: linkup-frontend
    ports:
      - "5173:80"
    volumes:
      - ./app_pro/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - linkup-network

volumes:
  mongo-data:

networks:
  linkup-network:
    driver: bridge
