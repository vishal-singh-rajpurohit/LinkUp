name: Deploy on EC2

on:
  push:
    branches: [production-ec2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd /home/ubuntu/LinkUp
            git config pull.rebase false
            git reset --hard origin/production-ec2
            git pull origin production-ec2

            # Ensure 2GB swap space is enabled to prevent OOM killer (exit code 137) during builds
            if [ $(swapon --show | wc -l) -le 1 ]; then
              echo "Configuring swap space to prevent memory exhaustion..."
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi

            # Generate production .env file dynamically on the server from GitHub Secrets
            cat << EOF > .env
            PORT=${{ secrets.PORT }}
            ATLAS_LINK='${{ secrets.ATLAS_LINK }}'
            ACCESS_TOKEN_SECRET='${{ secrets.ACCESS_TOKEN_SECRET }}'
            ACCESS_TOKEN_EXPIRY=${{ secrets.ACCESS_TOKEN_EXPIRY }}
            REFRESH_TOKEN_SECRET='${{ secrets.REFRESH_TOKEN_SECRET }}'
            REFRESH_TOKEN_EXPIRY=${{ secrets.REFRESH_TOKEN_EXPIRY }}
            CORS_ORIGIN='${{ secrets.CORS_ORIGIN }}'
            CORS_ORIGIN_1='${{ secrets.CORS_ORIGIN_1 }}'
            CORS_ORIGIN_2='${{ secrets.CORS_ORIGIN_2 }}'
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}
            GEO_API=${{ secrets.GEO_API }}
            CHAT_SECRET_KEY='${{ secrets.CHAT_SECRET_KEY }}'
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
            VITE_API_EMOJI_API_KEY=${{ secrets.VITE_API_EMOJI_API_KEY }}
            VITE_API=${{ secrets.VITE_API }}
            VITE_API_=${{ secrets.VITE_API_ }}
            VITE_API_CHAT_SECRET_KEY='${{ secrets.VITE_API_CHAT_SECRET_KEY }}'
            EOF

            # Stop existing containers
            docker compose -f ./docker-compose.prod.yml down

            # Build sequentially to avoid memory spikes on small EC2 instances
            docker compose -f ./docker-compose.prod.yml build backend
            docker compose -f ./docker-compose.prod.yml build frontend

            # Start containers detached
            docker compose -f ./docker-compose.prod.yml up -d
