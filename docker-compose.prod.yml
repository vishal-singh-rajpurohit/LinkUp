services:
  mongodb:
    image: mongo:latest
    container_name: linkup-mongodb-prod
    restart: unless-stopped
    # ports:
    #   - "27017:27017" # Secured in production; only accessible internally within docker network.
    volumes:
      - mongo-data-prod:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - linkup-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: linkup-backend-prod
    restart: unless-stopped
    ports:
      - "5000:5000" # Secured in production; reverse-proxied through frontend Nginx.
    env_file:
      - ./Backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - linkup-network

  frontend:
    build:
      context: ./app_pro
      dockerfile: Dockerfile
    container_name: linkup-frontend-prod
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - linkup-network

volumes:
  mongo-data-prod:

networks:
  linkup-network:
    driver: bridge
