services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: linkup-backend-prod
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      ATLAS_LINK: ${ATLAS_LINK}
      PORT: ${PORT:-5000}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_ORIGIN_1: ${CORS_ORIGIN_1}
      CORS_ORIGIN_2: ${CORS_ORIGIN_2}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      GEO_API: ${GEO_API}
      CHAT_SECRET_KEY: ${CHAT_SECRET_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - linkup-network

  frontend:
    build:
      context: ./app_pro
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_API_EMOJI_API_KEY: ${VITE_API_EMOJI_API_KEY}
        VITE_API: ${VITE_API}
        VITE_API_: ${VITE_API_}
        VITE_API_CHAT_SECRET_KEY: ${VITE_API_CHAT_SECRET_KEY}
    container_name: linkup-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - linkup-network

volumes:
  mongo-data-prod:

networks:
  linkup-network:
    driver: bridge
